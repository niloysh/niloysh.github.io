baseURL: "https://niloysh.github.io/"
languageCode: "en-us"
title: "Niloy Saha"
theme: "niloysh"

# enable SEO parameters
enableRobotsTXT: true
canonifyURLs: true

menu:
  nav:
    - name: "Home"
      url: /
      weight: 1
    - name: "Publications"
      url: /publications/
      weight: 3
    - name: "Education & Experience"
      url: /education/
      weight: 2
    - name: "Awards & Achievements"
      url: /awards/
      weight: 5
    - name: "Presentations & Talks"
      url: /presentations/
      weight: 4

  social:
    - identifier: Github
      name: Github
      pre: <i class="fa-brands fa-github"></i>
      url: https://github.com/niloysh/
      weight: 1
    - identifier: Linkedin
      name: Linkedin
      pre: <i class="fa-brands fa-linkedin"></i>
      url: https://www.linkedin.com/in/niloysh/
      weight: 2
    - identifier: Scholar
      name: Scholar
      pre: <i class="ai ai-google-scholar"></i>
      url: https://scholar.google.ca/citations?user=gSAv2FUAAAAJ&hl=en
      weight: 3
    - identifier: Dblp
      name: Dblp
      pre: <i class="ai ai-dblp"></i>
      url: https://dblp.uni-trier.de/pid/222/5598.html
      weight: 4

# enable HTML markup in .md pages
markup:
  goldmark:
    renderer:
      unsafe: true

# add last modified date to pages
enableGitInfo: true
frontmatter:
  lastmod:
    - lastmod
    - :git
    - date
    - publishDate

params:
  googleAnalyticsID: UA-225450829-1
  googleAnalytics: G-K1JEV96YJ4
  author: Niloy Saha
  description: "Niloy Saha is a PhD candidate at the University of Waterloo, Ontario, Canada. His research is focused on building intelligent next-generation mobile networks."
  keywords:
    - networks
    - research
    - niloy
    - saha
  image: "/images/niloy_photo_2021-09.jpg"
  cv: "/assets/CV.pdf"

<head itemscope itemtype="{{ .Site.BaseURL }}">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="{{ relURL "/css/style.css" }}">


    <!-- Icons -->
    <link rel="stylesheet" href="{{ relURL "/academicons/css/academicons.min.css" }}"/>
    <link rel="stylesheet" href="{{ relURL "/fontawesome/css/all.min.css" }}"/>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Quicksand:wght@400;500&display=swap" rel="stylesheet">
    

    {{ partial "meta.html" . }}

    {{ if .Site.Params.googleAnalyticsID }}
    {{ partial "analytics.html" . }}
    {{ end }}
</head>

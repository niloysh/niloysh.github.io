<!-- title -->
{{ $title := print .Site.Title " | " .Title }}
{{ if .IsHome }}{{ $title = .Site.Title }}{{ end }}
<title>{{ $title }}</title>

<!-- description -->
<meta name="description" content="{{ with .Site.Params.description}}{{ . }}{{ end }}">

<!-- cannonical -->
<!-- Used to indicate that there are other versions of this webpage. By implementing the canonical tag in the code, your website tells search engines that this URL is the main page -->
<base href="{{ .Permalink }}">
<link rel="canonical" href="{{ .Permalink }}" itemprop="url" /> 

<!-- keywords and author -->
<meta name="keywords" content="{{ with .Site.Params.keywords }}{{ delimit . "," }}{{ end }}">
<meta name="author" content="{{with .Site.Params.author }}{{ . }}{{end}}">
<meta name="copyright" content="{{with .Site.Params.author }}{{ . }}{{end}}" />

<!-- search engine crawler tags -->
<meta name="robots" content="index,follow" /> 
<meta name="googlebot" content="index,follow" />

<link rel="sitemap" type="application/xml" title="Sitemap" href="{{ .Site.BaseURL }}sitemap.xml" /> 

<!-- favicon tags -->
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="icon" type="image/x-icon" sizes="16x16 32x32" href="/favicon.ico" />
<link rel="apple-touch-icon" href="/favicons/apple-touch-icon.png" />
<link rel="icon" href="/favicons/favicon-32x32.png" sizes="32x32" />
<link rel="icon" href="/favicons/favicon-16x16.png" sizes="16x16" />
<link rel="icon" sizes="192x192" href="/favicons/android-chrome-192x192.png" />
<link rel="icon" sizes="512x512" href="/favicons/android-chrome-512x512.png" />

{{ define "main" }}
<main class="content">
    {{ $datafile := .Params.datafile }}
    {{ if $datafile }}
    <section id="awards">
        <h2>Awards</h2>
        {{ with index .Site.Data $datafile }}
        <ul>
            {{ range sort . "date" "desc" }}
            <li><a href="{{ .link }}">{{ .name }}</a></li>
            {{ end }}
        </ul>
        {{ end }}
    </section>
    {{ end }}
        
    
</main>

{{ end }}

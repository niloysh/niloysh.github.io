{{ define "main" }}
<main class="content">
    <h2>{{ .Title }}</h2>
    {{ $datafile := .Params.datafile }}
    {{ if $datafile }}
    <section id="conferences_and_workshops">
        {{ with index .Site.Data $datafile }}
        <h3>Conferences & Workshops</h3>
        <ul>
            {{ range sort .conference "date" "desc" }}
            <li><a href="{{ .link }}">{{ .talk }}</a> {{ .venue }}</li>
            {{ end }}
        </ul>
        {{ end }}
    </section>
    {{ end }}
</main>

{{ end }}

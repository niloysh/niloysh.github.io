{{ define "main" }}
<main class="content">

    <section id="news">
        <h2>News Archive</h2>
  
        <div class="icon-grid-one-column">
        {{ range where .Site.RegularPages "Section" "news" }}
  
        <div class="icon-grid__item">
          <div><i class="fa-solid fa-newspaper"></i></div>
          <div><a href="{{.Permalink}}">{{.Date.Format "Jan 2006"}} | {{.Title}}</a></div>
        </div>
        {{ end }}
        </div>
  
      </section>

</main>

{{ end }}
